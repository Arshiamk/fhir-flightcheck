[project]
name = "flightcheck-evaluator"
version = "0.1.0"
description = "Isolated deterministic rule evaluator for FHIR Flightcheck"
readme = "README.md"
authors = [
    { name = "Arshiamk", email = "arshia@live.co.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "nats-py>=2.15.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35.0"]

[project.scripts]
flightcheck-evaluator = "flightcheck_evaluator.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
